<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 240 244" width="240" height="244" focusable="false">
  <!--
    Chibi head. Every top-level group has an id so parts can be tweaked or
    replaced in a text editor, Figma or Inkscape. Layer order (back → front):
    shadow, hair-back, face, eyes, pupils, lashes, glasses, hair-front, ears.

    ids are prefixed automatically when the head is placed on a page
    (see character.js), so several heads can exist at once.

    Eye centres are at (90, 150) and (150, 150); character.js relies on that
    for blinking. Pupils move inside the eye-clip shapes.
  -->
  <defs>
    <radialGradient id="skin" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fdeadf" />
      <stop offset="0.65" stop-color="#f8d3bf" />
      <stop offset="1" stop-color="#ecb79e" />
    </radialGradient>
    <radialGradient id="ear-skin" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#f8d3bf" />
      <stop offset="1" stop-color="#e6a990" />
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5945" />
      <stop offset="0.55" stop-color="#6b4d3b" />
      <stop offset="1" stop-color="#876650" />
    </linearGradient>
    <linearGradient id="hair-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f4434" />
      <stop offset="1" stop-color="#755740" />
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#a27150" />
      <stop offset="0.7" stop-color="#7a4f35" />
      <stop offset="1" stop-color="#5a3826" />
    </radialGradient>
    <radialGradient id="lens" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffe3ec" stop-opacity="0.1" />
      <stop offset="1" stop-color="#f4b6c8" stop-opacity="0.22" />
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4a3f55" stop-opacity="0.2" />
      <stop offset="1" stop-color="#4a3f55" stop-opacity="0" />
    </radialGradient>
    <clipPath id="eye-left-clip"><ellipse cx="90" cy="150" rx="16" ry="18" /></clipPath>
    <clipPath id="eye-right-clip"><ellipse cx="150" cy="150" rx="16" ry="18" /></clipPath>
  </defs>

  <ellipse id="shadow-blob" cx="120" cy="256" rx="84" ry="11" fill="url(#shadow)" />

  <g id="head">
    <g id="hair-back">
      <path
        fill="url(#hair-dark)"
        d="M24 128 C24 74 62 40 120 40 C178 40 216 74 216 128 L218 232 L208 222 L202 246 L192 226 L184 240 L176 214
           C172 198 162 190 152 192 L88 192 C78 190 68 198 64 214 L56 240 L48 226 L38 246 L32 222 L22 232 Z"
      />
      <path d="M34 164 Q32 198 36 228 M206 164 Q208 198 204 228" stroke="#d7b088" stroke-width="1.8" stroke-linecap="round" opacity="0.45" fill="none" />
    </g>

    <g id="face">
      <path
        fill="url(#skin)"
        d="M120 88 C174 88 196 114 196 146 C196 178 164 198 120 198 C76 198 44 178 44 146 C44 114 66 88 120 88 Z"
      />
      <ellipse id="face-highlight" cx="84" cy="116" rx="20" ry="10" fill="#fff" opacity="0.35" transform="rotate(-20 84 116)" />
      <ellipse id="blush-left" cx="74" cy="177" rx="12" ry="6.5" fill="#f4a7b9" opacity="0.7" />
      <ellipse id="blush-right" cx="166" cy="177" rx="12" ry="6.5" fill="#f4a7b9" opacity="0.7" />
      <g id="nose">
        <ellipse cx="120" cy="172" rx="5" ry="3.6" fill="#e9a08b" />
        <ellipse cx="118.6" cy="170.8" rx="1.6" ry="1" fill="#fff" opacity="0.5" />
      </g>
      <path id="mouth" d="M112 182 Q120 189 128 182" stroke="#4a3f55" stroke-width="2.6" fill="none" stroke-linecap="round" />
    </g>

    <g id="eyes">
      <ellipse cx="90" cy="150" rx="16" ry="18" fill="#fffaf6" />
      <ellipse cx="150" cy="150" rx="16" ry="18" fill="#fffaf6" />
    </g>

    <g id="pupils">
      <g clip-path="url(#eye-left-clip)">
        <g id="pupil-left">
          <circle cx="90" cy="151" r="11" fill="url(#iris)" />
          <circle cx="90" cy="151" r="5.2" fill="#3a2820" />
          <circle cx="86.5" cy="146.5" r="3.2" fill="#fff" />
          <circle cx="93.5" cy="155" r="1.4" fill="#fff" opacity="0.8" />
        </g>
      </g>
      <g clip-path="url(#eye-right-clip)">
        <g id="pupil-right">
          <circle cx="150" cy="151" r="11" fill="url(#iris)" />
          <circle cx="150" cy="151" r="5.2" fill="#3a2820" />
          <circle cx="146.5" cy="146.5" r="3.2" fill="#fff" />
          <circle cx="153.5" cy="155" r="1.4" fill="#fff" opacity="0.8" />
        </g>
      </g>
    </g>

    <g id="lashes" stroke="#4a3f55" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M74 145 Q90 128 106 145" />
      <path d="M74 145 L69 141" stroke-width="2.4" />
      <path d="M134 145 Q150 128 166 145" />
      <path d="M166 145 L171 141" stroke-width="2.4" />
    </g>

    <g id="glasses">
      <circle cx="90" cy="150" r="23" fill="url(#lens)" stroke="#f0b3c4" stroke-width="2.4" />
      <circle cx="150" cy="150" r="23" fill="url(#lens)" stroke="#f0b3c4" stroke-width="2.4" />
      <path d="M113 147 Q120 141 127 147" stroke="#f0b3c4" stroke-width="2.4" fill="none" stroke-linecap="round" />
      <path d="M67 146 L52 144 M173 146 L188 144" stroke="#f0b3c4" stroke-width="2.4" stroke-linecap="round" />
      <path d="M75 137 Q81 130 89 129 M135 137 Q141 130 149 129" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.6" />
    </g>

    <g id="hair-front" fill="url(#hair)">
      <path
        d="M121 44 C80 44 42 72 40 118 L42 200 L46 236 L54 222 L60 244 L66 224 L72 236
           C70 204 60 168 60 138 C62 114 88 100 121 94 Z"
      />
      <path
        d="M120 44 C160 44 198 72 200 118 L198 200 L194 236 L186 222 L180 244 L174 224 L168 236
           C170 204 180 168 180 138 C178 114 152 100 120 94 Z"
      />
      <ellipse id="hair-shine" cx="84" cy="62" rx="22" ry="8" fill="#fff" opacity="0.16" transform="rotate(-24 84 62)" />
      <g id="hair-highlights" stroke="#e2c08f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M104 51 C76 60 56 88 52 130" />
        <path d="M54 158 Q52 192 57 222" />
        <path d="M140 50 C170 60 186 90 189 126" />
        <path d="M186 164 Q188 196 183 224" />
      </g>
    </g>

    <g id="ears">
      <ellipse cx="44" cy="154" rx="8.5" ry="12.5" fill="url(#ear-skin)" />
      <ellipse cx="45.5" cy="155" rx="3.5" ry="6" fill="#e3a28a" opacity="0.6" />
      <ellipse cx="196" cy="154" rx="8.5" ry="12.5" fill="url(#ear-skin)" />
      <ellipse cx="194.5" cy="155" rx="3.5" ry="6" fill="#e3a28a" opacity="0.6" />
    </g>
  </g>
</svg>
