<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{site.title}} · Portfolio</title>
    <meta name="description" content="{{site.role}}. {{site.tagline}}" />
    <meta name="theme-color" content="#cfe6f7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="/static.html">Skip to the simple version of this portfolio</a>

    <nav class="site-nav" aria-label="Portfolio sections">
      <ul>
        <li><button type="button" class="btn btn-pill" data-open="projects">Projects</button></li>
        <li><button type="button" class="btn btn-pill" data-open="about">About me</button></li>
        <li><button type="button" class="btn btn-pill" data-open="contact">Contact</button></li>
      </ul>
    </nav>

    <main>
      <!-- 1. Main menu -->
      <section id="screen-menu" class="screen screen-menu is-visible" aria-labelledby="menu-title">
        <div class="menu-panel">
          <p class="menu-kicker">{{site.role}}</p>
          <h1 id="menu-title" class="menu-title">{{site.title}}</h1>
          <div class="menu-actions">
            <button type="button" class="btn btn-primary btn-large" id="play-button">Play</button>
            <a class="btn btn-large" href="/static.html" id="quit-button">Quit</a>
          </div>
        </div>
        <!-- Filled by src/character/character.js -->
        <div class="menu-character" id="menu-character" aria-hidden="true"></div>
      </section>

      <!-- 2. Loading screen -->
      <section id="screen-loading" class="screen screen-loading" hidden aria-labelledby="loading-title">
        <div class="loading-card">
          <div class="loading-blob" aria-hidden="true"></div>
          <h2 id="loading-title" class="loading-title">Shaping the island…</h2>
          <div
            class="progress"
            id="loading-progress"
            role="progressbar"
            aria-labelledby="loading-title"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress-fill"></div>
          </div>
          <p class="loading-percent" id="loading-percent" aria-hidden="true">0%</p>
          <div class="loading-error" id="loading-error" hidden>
            <p id="loading-error-text">Something went wrong while loading the 3D world.</p>
            <div class="menu-actions">
              <button type="button" class="btn btn-primary" id="loading-retry">Try again</button>
              <a class="btn" href="/static.html">Open the simple version</a>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. The 3D world -->
      <section id="screen-world" class="screen screen-world" hidden aria-labelledby="world-title">
        <h2 id="world-title" class="visually-hidden" tabindex="-1">Portfolio island</h2>
        <div class="world-canvas" id="world-canvas"></div>
        <div class="building-label" id="building-label" aria-hidden="true">
          <span class="building-label-name"></span>
          <span class="building-label-hint"></span>
        </div>
        <div class="world-hud">
          <button type="button" class="btn btn-pill" id="menu-button">← Menu</button>
        </div>
        <div class="world-bottom">
          <p class="world-hint" id="world-hint">Drag to look around · tap a building to visit</p>
          <nav aria-label="Places on the island">
            <ul class="places" id="places"></ul>
          </nav>
        </div>
      </section>
    </main>

    <!-- Overlays (projects, project detail, about, contact) -->
    <dialog class="overlay" id="overlay" aria-labelledby="overlay-title">
      <div class="overlay-bar">
        <button type="button" class="btn btn-pill" id="overlay-back" hidden>← Back</button>
        <button type="button" class="btn btn-round" id="overlay-close" aria-label="Close">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div class="overlay-body" id="overlay-body"></div>
    </dialog>

    <noscript>
      <p class="noscript">This page needs JavaScript for the 3D world. <a href="/static.html">View the simple version</a>.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
